services:
  db:
    image: postgres:15-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?set AUTH_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?set AUTH_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?set AUTH_POSTGRES_DB in .env}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./blog/migrations
    container_name: blog_migrate
    depends_on:
      db:
        condition: service_healthy
    command: ["-path=/migrations", "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]

  auth_migrate:
    build: ./auth/migrations
    depends_on:
      auth_db:
        condition: service_healthy
    command: ["-path=/migrations", "-database=postgres://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@auth_db:5432/${AUTH_POSTGRES_DB}?sslmode=disable", "up"]

  api:
    build: ./blog
    container_name: blog_api
    restart: always
    env_file:
      - ./blog/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  auth:
    build: ./auth
    restart: always
    env_file:
      - ./auth/.env
    environment:
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB}
      AUTH_POSTGRES_HOST: auth_db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      auth_db:
        condition: service_healthy
      auth_migrate:
        condition: service_completed_successfully

  proxy:
    build: ./proxy
    container_name: blog_proxy
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - api
      - auth

volumes:
  postgres_data:
  auth_postgres_data:
