services:
  db:
    image: postgres:15-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?set AUTH_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?set AUTH_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?set AUTH_POSTGRES_DB in .env}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka_init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$KAFKA_TOPIC" --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$KAFKA_DLQ_TOPIC" --partitions 3 --replication-factor 1
    environment:
      KAFKA_TOPIC: ${ANALYTICS_KAFKA_TOPIC:-article-events}
      KAFKA_DLQ_TOPIC: ${ANALYTICS_KAFKA_DLQ_TOPIC:-article-events.dlq}
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: always
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  analytics_migrate:
    build: ./analytics/migrations
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["-path=/migrations", "-database=clickhouse://clickhouse:9000?username=default&database=default", "up"]

  migrate:
    build: ./blog/migrations
    container_name: blog_migrate
    depends_on:
      db:
        condition: service_healthy
    command: ["-path=/migrations", "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]

  auth_migrate:
    build: ./auth/migrations
    depends_on:
      auth_db:
        condition: service_healthy
    command: ["-path=/migrations", "-database=postgres://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@auth_db:5432/${AUTH_POSTGRES_DB}?sslmode=disable", "up"]

  api:
    build: ./blog
    container_name: blog_api
    restart: always
    env_file:
      - ./blog/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      BLOG_KAFKA_BROKERS: kafka:19092
      BLOG_KAFKA_TOPIC: ${ANALYTICS_KAFKA_TOPIC:-article-events}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka_init:
        condition: service_completed_successfully

  auth:
    build: ./auth
    restart: always
    env_file:
      - ./auth/.env
    environment:
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB}
      AUTH_POSTGRES_HOST: auth_db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      auth_db:
        condition: service_healthy
      auth_migrate:
        condition: service_completed_successfully

  analytics:
    build: ./analytics
    restart: always
    env_file:
      - ./analytics/.env
    environment:
      ANALYTICS_KAFKA_BROKERS: kafka:19092
      ANALYTICS_KAFKA_TOPIC: ${ANALYTICS_KAFKA_TOPIC:-article-events}
      ANALYTICS_KAFKA_DLQ_TOPIC: ${ANALYTICS_KAFKA_DLQ_TOPIC:-article-events.dlq}
      ANALYTICS_CLICKHOUSE_ADDR: clickhouse:9000
      ANALYTICS_CLICKHOUSE_DATABASE: default
      ANALYTICS_CLICKHOUSE_USER: default
      ANALYTICS_CLICKHOUSE_PASSWORD: ""
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      analytics_migrate:
        condition: service_completed_successfully

  proxy:
    build: ./proxy
    container_name: blog_proxy
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - api
      - auth
      - analytics

volumes:
  postgres_data:
  auth_postgres_data:
  kafka_data:
  clickhouse_data:
